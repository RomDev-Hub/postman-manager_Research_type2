          <script nonce="">
               const i18nParam = 'lang',
                 href = new URL(window.location.href),
                 params = new URLSearchParams(href.search);
          
              function generateLanguageList(langsList, activeLang) {
                  const langItems = langsList.map((langObj) => {
                      const langCode = Object.keys(langObj)[0];
                      const langName = langObj[langCode];
                      const isActive = langCode === activeLang;
                      const title = isActive ? `Current language: ${langName}` : `Use Postman in ${langName}`;
                      params.set(i18nParam, langCode);
                      href.search = params.toString();
          
                      return `<li  lang="${langCode}" title="${title}" ${isActive ? ' class="active"' : ''}><a  href="${href}">${langName}</a></li>`;
                  });
          
            return langItems.join('');
          }
          
              const langsList = [
                  { 'en-US': "English" },
                  { 'ja': "日本語" }
              ];
          
              const activeLang = 'en-US';
              document.querySelector('#langsList').innerHTML = generateLanguageList(langsList, activeLang);
          
          </script>

        <script nonce="">
          (function () {
            const authFlowId = 'f7b06376-0ca1-45e1-9f00-6594c94b9a87';
            if (!authFlowId || !window.history || !window.history.replaceState) return;
        
            try {
              // --- 1. Update current page URL ---
              const url = new URL(window.location.href);
              const params = url.searchParams;
        
              if (params.get('authFlowId') !== authFlowId) {
                params.set('authFlowId', authFlowId);
                url.search = params.toString();
                window.history.replaceState({ authFlowId }, document.title, url.toString());
              }
        
              // --- 2. Update all anchor hrefs on the page ---
              window.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('a[href]').forEach(anchor => {
                  // Skip anchors to external hosts that should preserve their absolute URL
                  if (anchor.getAttribute('rel') === 'external') return;
        
                  const href = anchor.getAttribute('href');
                  if (!href ||
                    href.startsWith('#') ||
                    href.startsWith('javascript:') ||
                    href.startsWith('data:') ||
                    href.startsWith('vbscript:') ||
                    href.startsWith('mailto:') ||
                    href.startsWith('tel:')
                  ) return;
        
                  try {
                    const linkUrl = new URL(href, window.location.origin);
                    if (!linkUrl.searchParams.has('authFlowId') && linkUrl.origin === window.location.origin) {
                      linkUrl.searchParams.set('authFlowId', authFlowId);
                      anchor.setAttribute('href', linkUrl.pathname + linkUrl.search + linkUrl.hash);
                    }
                  } catch(e) {
                    console.log("Skipping invalid URL: ", href, e);
                  }
                });
              });
        
              // --- 3. Intercept all XHR calls and append authFlowId ---
              (function() {
                const origOpen = XMLHttpRequest.prototype.open;
        
                XMLHttpRequest.prototype.open = function(method, url, async) {
                  try {
                    let fullUrl = url;
        
                    if (authFlowId && !fullUrl.includes('authFlowId=')) {
                      const sep = fullUrl.includes('?') ? '&' : '?';
                      fullUrl += sep + 'authFlowId=' + encodeURIComponent(authFlowId);
                    }
        
                    return origOpen.call(this, method, fullUrl, async);
                  } catch (err) {
                    console.error("XHR interceptor error:", err);
                    return origOpen.apply(this, arguments);
                  }
                };
              })();
        
            } catch (e) {
              console.error('Failed to update URL or hrefs with authFlowId: ', e);
            }
          })();
        </script>

     <script nonce="">


			let timerId, loader, accountsContainer;

      function resetLoaderState(){
        clearTimeout(timerId);
        timerId = null;
        accountsContainer.removeClass('disabled');
        loader.style.display = 'none';
      }

			function handleCardClick(e) {
					const currentTarget = e.currentTarget;
					if (currentTarget.tagName.toLowerCase() !== 'a') return;

          accountsContainer = DOMUtils.select('#account_select_container');
					loader = currentTarget.querySelector('.loaderContainer');

					loader.style.display = 'block';
          accountsContainer.addClass('disabled');

					if (timerId) clearTimeout(timerId);
					timerId = setTimeout(() => {
              resetLoaderState();
              analytics.recordEvent({
                action: 'initiate_select_timedout',
                label: 'account_select'
              });
					}, 10000);

          analytics.recordEvent({
            action: 'initiate_select_account',
            label: 'account_select'
          });
			}

			DOMUtils.on('.pm-card-account', 'click', handleCardClick);
      DOMUtils.on('.pm-card-add-account', 'click', (e) => {
        analytics.recordEvent({
          action: 'initiate_add_new_account',
          label: 'account_select'
        });
      });


      window.addEventListener('pageshow', (e) => {
				if (e.persisted) { resetLoaderState() }
			});

      analytics.recordEvent({action: 'select_account_landing', label: 'account_select' });

    </script>
